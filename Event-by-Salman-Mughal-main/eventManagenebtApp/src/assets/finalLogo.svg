<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sofa Gold -->
    <linearGradient id="sofaGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3D37A"></stop>
      <stop offset="100%" stop-color="#C9A13B"></stop>
    </linearGradient>

    <!-- Light Flower -->
    <radialGradient id="flowerLight">
      <stop offset="0%" stop-color="#FFF1C1"></stop>
      <stop offset="100%" stop-color="#F4A261"></stop>
    </radialGradient>
  </defs>

  <!-- ICON -->
  <g transform="translate(20,14)">

    <!-- LEFT FRAME -->
    <path d="M6 14 V46" stroke="#D6D6D6" stroke-width="2" stroke-linecap="round" fill="none"></path>

    <!-- RIGHT FRAME -->
    <path d="M46 14 V46" stroke="#D6D6D6" stroke-width="2" stroke-linecap="round" fill="none"></path>

    <!-- TOP FRAME -->
    <path d="M6 14 Q26 -2 46 14" stroke="#D6D6D6" stroke-width="2" stroke-linecap="round" fill="none"></path>

    <!-- TOP FLOWERS -->
    <circle cx="10" cy="12" r="3" fill="url(#flowerLight)"></circle>
    <circle cx="16" cy="8" r="3" fill="#E63946"></circle>
    <circle cx="22" cy="6" r="3" fill="url(#flowerLight)"></circle>
    <circle cx="26" cy="5" r="3" fill="#E63946"></circle>
    <circle cx="30" cy="6" r="3" fill="url(#flowerLight)"></circle>
    <circle cx="36" cy="8" r="3" fill="#E63946"></circle>
    <circle cx="42" cy="12" r="3" fill="url(#flowerLight)"></circle>

    <!-- LEFT FLOWERS -->
    <circle cx="6" cy="18" r="3" fill="#E63946"></circle>
    <circle cx="8" cy="22" r="3" fill="url(#flowerLight)"></circle>
    <circle cx="6" cy="26" r="3" fill="#E63946"></circle>

    <!-- RIGHT FLOWERS -->
    <circle cx="46" cy="18" r="3" fill="#E63946"></circle>
    <circle cx="44" cy="22" r="3" fill="url(#flowerLight)"></circle>
    <circle cx="46" cy="26" r="3" fill="#E63946"></circle>

    <!-- SOFA BACK -->
    <rect x="14" y="30" width="24" height="8" rx="3" fill="url(#sofaGold)"></rect>

    <!-- SOFA SEAT -->
    <rect x="12" y="36" width="28" height="8" rx="3" fill="#E9C46A"></rect>

    <!-- SOFA ARMS -->
    <rect x="10" y="32" width="4" height="12" rx="2" fill="#D4A017"></rect>
    <rect x="40" y="32" width="4" height="12" rx="2" fill="#D4A017"></rect>

  </g>

  <!-- TEXT -->
  <text x="90" y="55" font-size="36" font-weight="700" fill="#1E1E1E" font-family="Poppins, Arial, sans-serif" letter-spacing="1">
    Event
  </text>

  <text x="92" y="85" font-size="16" fill="#6B6B6B" font-family="Poppins, Arial, sans-serif" letter-spacing="2">
    BY SALMAN MUGHAL
  </text>
</svg>
