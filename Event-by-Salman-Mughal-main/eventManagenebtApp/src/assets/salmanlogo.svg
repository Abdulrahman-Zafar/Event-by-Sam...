<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (transparent) -->
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5C16C"></stop>
      <stop offset="100%" stop-color="#C89B3C"></stop>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(20,20)">
    <!-- Spark -->
    <polygon points="20,0 24,14 38,18 24,22 20,36 16,22 2,18 16,14" fill="url(#goldGradient)"></polygon>
    
    <!-- Stage Curve -->
    <path d="M0 50 Q20 40 40 50" stroke="#1E1E1E" stroke-width="3" fill="none" stroke-linecap="round"></path>
  </g>

  <!-- Main Text -->
  <text x="90" y="55" font-size="36" font-weight="700" fill="#1E1E1E" font-family="Poppins, Arial, sans-serif" letter-spacing="1">
    Event
  </text>

  <!-- Sub Text -->
  <text x="92" y="85" font-size="16" fill="#6B6B6B" font-family="Poppins, Arial, sans-serif" letter-spacing="2">
    BY SALMAN MUGHAL
  </text>
</svg>
